<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Store admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
  body { background: var(--concrete); }
  .adm-bar { background: var(--ink); color: #fff; }
  .adm-bar .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px; flex-wrap: wrap; }
  .adm-bar .logo { color: #fff; }
  .adm-tabs { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .adm-tabs button { background: none; border: 0; color: #C9D2D9; padding: 8px 14px; border-radius: var(--r); cursor: pointer; font-weight: 600; }
  .adm-tabs button[aria-selected="true"] { background: var(--yellow); color: var(--ink); }
  .adm-bar a, .adm-bar .link-btn { color: #C9D2D9; }
  .adm-main { padding-block: 28px 80px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
  .stat { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
  .stat b { display: block; font: 700 2rem/1.1 var(--display); }
  .stat span { color: var(--steel); font-size: .92rem; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 1.4rem; margin-bottom: 12px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .panel-head h2 { margin: 0; }
  table.list { width: 100%; border-collapse: collapse; font-size: .96rem; }
  table.list th, table.list td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.list th { color: var(--steel); font-weight: 600; font-size: .88rem; }
  table.list tr[data-row] { cursor: pointer; }
  table.list tr[data-row]:hover { background: #F6F7F8; }
  table.list img { width: 44px; height: 44px; object-fit: cover; border-radius: var(--r); }
  .scroll { overflow-x: auto; }
  .checks { display: grid; gap: 8px; }
  .check { display: flex; gap: 10px; align-items: baseline; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--hivis); flex: none; transform: translateY(-1px); }
  .dot.on { background: var(--ok); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  textarea { min-height: 96px; resize: vertical; }
  .row-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .tick { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .login { max-width: 400px; margin: 12vh auto; }
  .muted { color: var(--steel); }
  .danger { border-color: var(--hivis); color: var(--hivis); }
  dialog { border: 2px solid var(--ink); border-radius: var(--r); padding: 0; width: min(760px, calc(100% - 24px)); max-height: 92vh; }
  dialog::backdrop { background: rgba(20, 33, 43, .55); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--paper); z-index: 1; }
  .dlg-body { padding: 20px; display: grid; gap: 16px; }
  .cj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 16px; }
  .cj-item { border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 6px; font-size: .92rem; }
  .cj-item img { aspect-ratio: 1; object-fit: cover; width: 100%; border-radius: var(--r); background: var(--concrete); }
  @media (max-width: 760px) { .stats { grid-template-columns: 1fr 1fr; } .form-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app"><p class="wrap" style="padding:40px 0">Loading…</p></div>
<dialog id="dlg"></dialog>
<div class="toast" role="status" aria-live="polite" hidden></div>
<script src="/assets/admin.js" defer></script>
</body>
</html>
